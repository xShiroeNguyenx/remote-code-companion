name: Release

# Publishing is irreversible: a version number on the Marketplace can never be
# reused, only superseded. So this runs the whole suite first, refuses to
# publish a tag that disagrees with package.json, and refuses to publish a
# version that is already live.
#
# Trigger: push a tag matching the version, e.g.
#   git tag v0.4.0 && git push origin v0.4.0
#
# Secrets: VSCE_PAT — an Azure DevOps Personal Access Token with
# Marketplace → Manage, for the organisation that owns the `shiroenguyen`
# publisher.
#          OVSX_PAT — an Open VSX token; optional, and skipped when absent.
# See RELEASE.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only — do not publish'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment in repo Settings → Environments
    # if you want a human to approve every publish.
    environment: marketplace

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: CHANGELOG must document this version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! grep -qE "^##+ +\[?${VERSION//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Unit + smoke tests
        run: npm test

      - name: Integration tests (in-process FTP + SFTP)
        run: npm run test:integration

      - name: Verify package contents
        run: npm run verify:package

      # Requiring the packaged tree catches a dependency that resolves in
      # development but is excluded from the vsix.
      - name: Verify the packaged tree can load
        run: npm run verify:runtime

      - name: Build vsix
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce package --allow-missing-repository --out "remote-code-companion-${VERSION}.vsix"

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: remote-code-companion-vsix
          path: '*.vsix'
          retention-days: 90

      - name: Check publish preconditions
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Secret VSCE_PAT is not set — see RELEASE.md"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHER="$(node -p "require('./package.json').publisher")"
          NAME="$(node -p "require('./package.json').name")"
          # `vsce show` lists published versions; a match means this number is burnt.
          if npx vsce show "${PUBLISHER}.${NAME}" 2>/dev/null | grep -qE "(^| )${VERSION//./\\.}( |$)"; then
            echo "::error::${PUBLISHER}.${NAME} ${VERSION} is already on the Marketplace — bump the version"
            exit 1
          fi

      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce publish --allow-missing-repository --packagePath "remote-code-companion-${VERSION}.vsix"

      # Open VSX is what VSCodium, Gitpod and Theia install from. The same vsix is
      # published to both registries — a second build would ship bytes nobody
      # verified. Skipped, not failed, when no token is configured: a missing
      # Open VSX token must not look like a failed Marketplace release, which by
      # this point has already happened and cannot be undone.
      - name: Publish to Open VSX
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set — skipping Open VSX. See RELEASE.md."
            exit 0
          fi
          npm run publish:ovsx

      - name: Summary
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Remote Code Companion ${VERSION}"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — vsix built and verified, nothing published."
            else
              echo "Published to the VS Code Marketplace."
              echo "https://marketplace.visualstudio.com/items?itemName=shiroenguyen.remote-code-companion"
              if [ -n "${{ secrets.OVSX_PAT }}" ]; then
                echo "Published to Open VSX."
                echo "https://open-vsx.org/extension/shiroenguyen/remote-code-companion"
              else
                echo "Open VSX skipped — no OVSX_PAT secret."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
